name: Validate version

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          VERSION=$(cat VERSION)
          FAILED=0

          PLUGIN_VERSION=$(jq -r '.version' .devin-plugin/plugin.json)
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: VERSION=$VERSION but .devin-plugin/plugin.json.version=$PLUGIN_VERSION"
            FAILED=1
          fi

          [ "$FAILED" -eq 0 ] && echo "All versions consistent: $VERSION"
          exit $FAILED
