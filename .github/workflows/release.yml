#
# Cuts a GitHub Release when the version file on main is newer than the latest tag.
# Full flow and rationale: CONTRIBUTING.md#releasing
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the tag check below can see existing tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The manifest is the only place the version lives.
      - name: Read version from the plugin manifest
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' .devin-plugin/plugin.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.devin-plugin/plugin.json version '$VERSION' is not X.Y.Z — refusing to release"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Fails the job on anything but a clean forward bump, so the steps after it need no
      # condition of their own.
      - name: Compare version against latest release tag
        id: release_gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          # git's globs can't anchor digits, so the shape is enforced with grep instead. Scope
          # `|| true` to grep so a real `git tag` failure is not treated as "no tags yet".
          LATEST=$(git tag -l | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No prior release tag — v${VERSION} will be the first release"
            exit 0
          fi
          LATEST_VERSION="${LATEST#v}"
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            echo "::error::v${VERSION} was already released — bump .devin-plugin/plugin.json before merging"
            exit 1
          fi
          TAG_FOR_VERSION="v${VERSION}"
          LOWEST=$(printf '%s\n%s\n' "$TAG_FOR_VERSION" "$LATEST" | sort -V | head -1)
          if [ "$LOWEST" = "$TAG_FOR_VERSION" ]; then
            echo "::error::.devin-plugin/plugin.json version ${VERSION} is older than the latest release ${LATEST} — check for an accidental revert"
            exit 1
          fi
          echo "Version ${VERSION} is newer than ${LATEST} — proceeding with release"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # validate.yml runs on this same push, but as an independent workflow that can't gate this
      # one. Re-running its check here is what actually gates the release on it.
      - name: Validate plugin layout before releasing
        run: node scripts/validate-devin-plugin.mjs

      # Tracked files at HEAD only, so nothing left on the runner can end up in the zip.
      - name: Package release artifact
        run: git archive --format=zip --output=release.zip HEAD -- ':(exclude).github'

      # --target creates the tag as part of the release, so a failure can't leave an orphan tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release.zip \
            --target "$GITHUB_SHA" \
            --title "Release v${VERSION}" \
            --generate-notes

      # Only when the gate passed: a gate failure means v${VERSION} was already released by an
      # earlier run, and deleting it here would destroy a shipped release.
      - name: Roll back a partially published release
        if: failure() && steps.release_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release delete "v${VERSION}" --yes --cleanup-tag || true
